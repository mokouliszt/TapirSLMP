name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required so GitHub will issue an OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore TapirSLMP.slnx
      - run: dotnet build TapirSLMP.slnx --configuration Release --no-restore
      - run: dotnet test TapirSLMP.slnx --configuration Release --no-build
      - run: dotnet pack TapirSLMP.slnx --configuration Release --no-build -o artifacts

      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
