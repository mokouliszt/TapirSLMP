services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tapirslmp
      POSTGRES_USER: tapirslmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - tapirslmp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapirslmp -d tapirslmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  freezer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Freezer__Provider: Postgres
      Freezer__PostgresConnectionString: Host=postgres;Port=5432;Database=tapirslmp;Username=tapirslmp;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Freezer__SealerToken: ${SEALER_TOKEN:?set SEALER_TOKEN}
      Freezer__LiberatorToken: ${LIBERATOR_TOKEN:?set LIBERATOR_TOKEN}
      Freezer__AllowStateChangingCommands: ${ALLOW_STATE_CHANGING_COMMANDS:-false}

volumes:
  tapirslmp-postgres:
